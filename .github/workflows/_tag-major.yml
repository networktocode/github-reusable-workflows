---
# Keeps the floating major tag (v1, v2, ...) pointing at the newest release so callers can pin `@v1`.
name: "Update major version tag"
on:  # yamllint disable-line rule:truthy rule:comments
  release:
    types: ["published"]

permissions:
  contents: "write"

jobs:
  tag-major:
    name: "Move major tag to ${{ github.ref_name }}"
    runs-on: "ubuntu-latest"
    if: "startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: "Move the major tag"
        env:
          TAG_NAME: "${{ github.ref_name }}"
        run: |
          if ! [[ "$TAG_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Tag $TAG_NAME is not a vMAJOR.MINOR.PATCH release; not moving a major tag."
            exit 0
          fi
          MAJOR_TAG="v${BASH_REMATCH[1]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$MAJOR_TAG" -m "Update $MAJOR_TAG to $TAG_NAME" "$TAG_NAME"
          # Leading '+' in the refspec overwrites the existing remote tag.
          git push origin "+refs/tags/$MAJOR_TAG:refs/tags/$MAJOR_TAG"
          echo "Moved $MAJOR_TAG to $TAG_NAME"
