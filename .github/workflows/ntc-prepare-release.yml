---
# Reusable workflow that bumps the version, regenerates the lock file and release notes, opens the
# release PR and creates a draft GitHub release.
#
# Call it from a repo's .github/workflows/prepare_release.yml on `workflow_dispatch`, forwarding the
# dispatch inputs. The caller MUST grant: contents: write, pull-requests: write.
name: "NTC Prepare Release"

on:  # yamllint disable-line rule:truthy rule:comments
  workflow_call:
    inputs:
      bump_rule:
        description: "Version bump type: prerelease, patch, minor or major."
        required: true
        type: "string"
      target_branch:
        description: "Create the release from this branch (default: main)."
        required: false
        type: "string"
        default: "main"
      date:
        description: "Date of the release YYYY-MM-DD (defaults to today's date in the US Eastern TZ)."
        required: false
        type: "string"
        default: ""
      previous_version:
        description: "Previous version tag used to generate release notes (defaults to the latest tag or the initial commit)."
        required: false
        type: "string"
        default: ""
      poetry_version:
        description: "Poetry version to install on the runner."
        required: false
        type: "string"
        default: "2.1.3"
    secrets:
      GH_BOT_TOKEN:
        description: "Personal access token of a bot user. Optional; without it GITHUB_TOKEN is used and the created PR does not trigger workflows."
        required: false
      ARTIFACTORY_USERNAME:
        description: "Commercial projects only: username for the private artifactory-pypi Poetry source."
        required: false
      ARTIFACTORY_PASSWORD:
        description: "Commercial projects only: password for the private artifactory-pypi Poetry source."
        required: false

env:
  # If target_branch is 'main', use 'develop' as the source branch. Otherwise, the source and target branch are the same.
  SOURCE_BRANCH: "${{ inputs.target_branch == 'main' && 'develop' || inputs.target_branch }}"
  TARGET_BRANCH: "${{ inputs.target_branch }}"
  # Empty for OSS projects; Poetry only uses them when pyproject.toml declares an "artifactory-pypi" source.
  POETRY_HTTP_BASIC_ARTIFACTORY_PYPI_USERNAME: "${{ secrets.ARTIFACTORY_USERNAME }}"
  POETRY_HTTP_BASIC_ARTIFACTORY_PYPI_PASSWORD: "${{ secrets.ARTIFACTORY_PASSWORD }}"

jobs:
  prepare-release:
    name: "Prepare Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
      pull-requests: "write"
    steps:
      - name: "Validate bump rule"
        env:
          BUMP_RULE: "${{ inputs.bump_rule }}"
        run: |
          case "$BUMP_RULE" in
            prerelease|patch|minor|major) ;;
            *) echo "::error::bump_rule must be one of prerelease, patch, minor, major (got '$BUMP_RULE')"; exit 1 ;;
          esac

      - name: "Checkout code"
        uses: "actions/checkout@v7"
        with:
          ref: "${{ env.SOURCE_BRANCH }}"
          fetch-depth: 0  # Fetch all history for git tags

      - name: "Setup environment"
        uses: "networktocode/github-reusable-workflows/.github/actions/setup-poetry-environment@v1"
        with:
          poetry-version: "${{ inputs.poetry_version }}"
          poetry-install-options: "--with dev"

      - name: "Validate Branch and Tags"
        env:
          PREVIOUS_VERSION_INPUT: "${{ inputs.previous_version }}"
        run: |
          # 1. Verify branch exists
          if ! git rev-parse --verify "origin/$TARGET_BRANCH" > /dev/null 2>&1; then
            echo "Error: Branch $TARGET_BRANCH does not exist."
            exit 1
          fi

          # 2. Try to get the previous version tag
          # If it fails (no tags), get the hash of the first commit
          if [ -n "$PREVIOUS_VERSION_INPUT" ]; then
            PREV_TAG="$PREVIOUS_VERSION_INPUT"
            echo "Using user-specified previous version: $PREV_TAG"
            echo "PREVIOUS_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          elif PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "PREVIOUS_TAG=$PREV_TAG" >> "$GITHUB_ENV"
            echo "Found previous tag: $PREV_TAG"
          else
            # Fallback to the first commit in the repository
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            echo "PREVIOUS_TAG=$FIRST_COMMIT" >> "$GITHUB_ENV"
            echo "No tags found. Falling back to initial commit: $FIRST_COMMIT"
          fi

      - name: "Determine New Version"
        id: "versioning"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          BUMP_RULE: "${{ inputs.bump_rule }}"
        run: |
          # Bump the poetry version based on the user input
          CURRENT_POETRY_VER=$(poetry version --short)
          set +e  # continue running if the next command fails
          GITHUB_RELEASE_EXISTS=$(gh release view "v$CURRENT_POETRY_VER" --json publishedAt --jq '.publishedAt')
          set -e
          # Unconditionally bump the version if the current version is alpha0 or beta0
          if [[ $CURRENT_POETRY_VER == *a0 || $CURRENT_POETRY_VER == *b0 || $CURRENT_POETRY_VER == *rc0 ]]; then
            poetry version "$BUMP_RULE"
          # If the bump rule is prerelease and a release doesn't already exist in github we don't bump the version
          # This is because we've already bumped to the prerelease version after the previous release
          elif [[ "$BUMP_RULE" == "prerelease" && "$CURRENT_POETRY_VER" =~ (a|b|rc)[0-9]+$ && -z "$GITHUB_RELEASE_EXISTS" ]]; then
            echo "Prerelease v$CURRENT_POETRY_VER does not exist in github, using this version"
          else
            poetry version "$BUMP_RULE"
          fi

          # Capture the New version string for use in other steps
          NEW_VER=$(poetry version --short)
          echo "NEW_VERSION=$NEW_VER" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release/$NEW_VER" >> "$GITHUB_ENV"

      - name: "Set Date Variable"
        env:
          DATE_INPUT: "${{ inputs.date }}"
        run: |
          if [ -z "$DATE_INPUT" ]; then
            RELEASE_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          else
            RELEASE_DATE="$DATE_INPUT"
          fi
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"

      - name: "Create Release Branch"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          # Ensure release branch doesn't already exist
          if git rev-parse --verify "origin/$RELEASE_BRANCH" > /dev/null 2>&1; then
            echo "Error: Release branch $RELEASE_BRANCH already exists."
            exit 1
          fi

          # Create a new branch for the release
          git checkout -b "$RELEASE_BRANCH"

      - name: "Regenerate poetry.lock"
        run: "poetry lock --regenerate"

      - name: "Generate Github Release Notes"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # 1. Get Towncrier Draft
          TOWNCRIER_NOTES=$(poetry run towncrier build --version "$NEW_VERSION" --date "$RELEASE_DATE" --draft)

          # 2. Call GitHub API to generate raw notes
          RAW_GH_NOTES=$(gh api "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v$NEW_VERSION" \
            -f target_commitish="$SOURCE_BRANCH" \
            -f previous_tag_name="$PREVIOUS_TAG" --jq '.body')

          # 3. Parse usernames (Regex match)
          # We use grep to find "@user" patterns, sort, and uniq them
          USERNAMES=$(echo "$RAW_GH_NOTES" | grep -oP 'by @\K[a-zA-Z0-9-]+' | sort -u | grep -vE 'dependabot|nautobot-bot|github-actions' || true)

          # 4. Format the Contributors section
          CONTRIBUTORS_SECTION="## Contributors"
          for user in $USERNAMES; do
            CONTRIBUTORS_SECTION="$CONTRIBUTORS_SECTION"$'\n'"* @$user"
          done

          # 5. Extract the "Full Changelog" or "New Contributors" part
          # Using awk to grab everything from '## New Contributors' or '**Full Changelog**' to the end
          GH_FOOTER=$(echo "$RAW_GH_NOTES" | awk '/## New Contributors/ || /\*\*Full Changelog\*\*/ {found=1} found {print}')
          if [ -z "$GH_FOOTER" ]; then
            GH_FOOTER=$(echo "$RAW_GH_NOTES" | sed -n '/**Full Changelog**/,$p')
          fi

          # 6. Combine everything
          FINAL_NOTES="$TOWNCRIER_NOTES"$'\n\n'"$CONTRIBUTORS_SECTION"$'\n\n'"$GH_FOOTER"

          # 7. Save to a temporary file to avoid shell argument length limits
          echo "$FINAL_NOTES" > ../consolidated_notes.md

      - name: "Generate Release Notes and update mkdocs.yml"
        run: "poetry run invoke generate-release-notes --version \"$NEW_VERSION\" --date \"$RELEASE_DATE\""

      - name: "Commit Changes and Push"
        run: |
          # Add all changes (pyproject.toml, poetry.lock, etc.)
          git add .
          git commit -m "prepare release v$NEW_VERSION"
          git push origin "$RELEASE_BRANCH"

      - name: "Create Pull Request"
        env:
          # PRs created with GITHUB_TOKEN do not trigger workflows; pass GH_BOT_TOKEN (a PAT) to get CI on the release PR.
          # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
          GH_TOKEN: "${{ secrets.GH_BOT_TOKEN || secrets.GITHUB_TOKEN }}"
        run: |
          gh pr create \
            --title "Release v$NEW_VERSION" \
            --body-file "../consolidated_notes.md" \
            --base "$TARGET_BRANCH" \
            --head "$RELEASE_BRANCH"

      - name: "Create Draft Release"
        env:
          GH_TOKEN: "${{ secrets.GH_BOT_TOKEN || secrets.GITHUB_TOKEN }}"
          BUMP_RULE: "${{ inputs.bump_rule }}"
        run: |
          if [[ "$BUMP_RULE" == "prerelease" ]]; then
            RELEASE_FLAGS="--prerelease"
          elif [[ "$TARGET_BRANCH" == "main" ]]; then
            RELEASE_FLAGS="--latest"
          else
            RELEASE_FLAGS="--latest=false"
          fi

          gh release create "v$NEW_VERSION" \
            --draft \
            $RELEASE_FLAGS \
            --title "v$NEW_VERSION - $RELEASE_DATE" \
            --notes-file "../consolidated_notes.md" \
            --target "$TARGET_BRANCH"
