---
name: "Release"
on:  # yamllint disable-line rule:truthy rule:comments
  release:
    types: ["published"]

jobs:
  release:
    uses: "networktocode/github-reusable-workflows/.github/workflows/ntc-release.yml@v1"
    permissions:
      contents: "write"
      pull-requests: "write"
      id-token: "write"  # Required for PyPI Trusted Publishing
    # Optional overrides (defaults shown):
    # with:
    #   poetry_version: "2.1.3"
    #   python_version: "3.12"
    #   publish_environment: "pypi"
    secrets:
      GH_BOT_TOKEN: "${{ secrets.GH_NAUTOBOT_BOT_TOKEN }}"
      SLACK_WEBHOOK_URL: "${{ secrets.OSS_PYPI_SLACK_WEBHOOK_URL }}"
